name: Test

on:
  push:
    branches: [main, "revamp/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Menyalakan Postgres tertanam, menerapkan migrasi, lalu menjalankan seluruh test.
      - run: npm test
